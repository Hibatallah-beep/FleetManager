<div class="stats-container">

  <div class="stat-card">
    <h3>Total des véhicules</h3>
    <p>{{ TotalVehicles }}</p>
  </div>

  <div class="stat-card">
    <h3>Véhicules disponibles</h3>
    <p>{{ availableVehicles }}</p>
  </div>

  <div class="stat-card">
    <h3>Véhicules en service</h3>
    <p>{{ inServiceVehicles }}</p>
  </div>

  <div class="stat-card">
    <h3>Véhicules en maintenance</h3>
    <p>{{ maintenanceVehicles }}</p>
  </div>

</div>
