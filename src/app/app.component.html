@if (AuthService.isAuthenticated()) {

  <nav class="navbar">
    <div class="container">
      <a class="navbar-brand" routerLink="/vehicles">FleetManager</a>

      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" routerLink="/vehicles">Les véhicules</a>
        </li>

        @if (roleUtilisateur === 'MANAGER') {
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/maintenance">
              Demandes de maintenance
            </a>
          </li>
        }
      </ul>

      <button class="logout-btn" type="button"
        (click)="AuthService.logout()">
        Se déconnecter
      </button>
    </div>
  </nav>

  <div class="welcome">
    <h3>Bonjour {{ roleUtilisateur }}, {{ nomUtilisateur }}</h3>
  </div>

}

<router-outlet></router-outlet>
